version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR per ecosystem group to keep the
      # review load low; majors stay separate so they can be assessed on their own.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Majors are grouped in here, unlike npm above: an action's major is
      # usually a runner runtime bump that lands across all of them at once
      # (Node 20 -> 24 in September 2026), so they are assessed together
      # anyway. Reviewing them one at a time is what let them drift four
      # majors behind — a closed PR is never offered again.
      actions:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch

  # The base images: the next Alpine branch for the image that serves the
  # site (each branch gets security fixes for about two years, so it is taken
  # within the year, docs/SECURITY.md), and Node within its major for the
  # build. A new Node major goes with the project's own (AGENTS.md).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

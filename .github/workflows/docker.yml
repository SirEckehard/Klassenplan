name: Docker

# Builds the production image per architecture on native runners (no QEMU —
# the build stage prerenders every route in a real Chromium) and pushes a
# multi-arch manifest to GHCR. Runs on release tags (v*) and manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sireckehard/klassenplan

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # Push by digest only; the merge job assembles the tagged
          # multi-arch manifest from both digests.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags (v1.7.0) produce 1.7.0, 1.7 and latest; manual runs from
      # a branch produce a branch-named tag instead.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # Publishes the GitHub release once both architectures are up, so the notes
  # and a pullable image land together. Tag pushes only: a manual run from a
  # branch has no version to release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Headings read "## [1.9.0] - 2026-07-29", so drop the tag's leading v.
          version="${TAG#v}"
          awk -v want="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" want "]") > 0) { found = 1; next }
            }
            found
          ' docs/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::docs/CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A hyphen marks a pre-release (v2.1.0-rc.1); those must not become
          # the "latest" release, matching metadata-action's latest=auto above.
          flags=(--title "$TAG" --notes-file notes.md)
          case "$TAG" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *)   flags+=(--latest) ;;
          esac

          # Re-running the workflow on an existing tag must not hard-fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating its notes."
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag "${flags[@]}"
          fi

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # `npm run check:ci` runs the same checks locally, in this order; keep the
    # two in step.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci # Install dependencies from the lockfile
      - run: npx playwright install --with-deps chromium # Browser used by the prerender step
      - run: npm run lint # Run linting
      - run: npm run typecheck:all # Type-check production and test sources
      - run: npm run check:i18n # DE/EN key parity, no inline defaults, no unused keys
      - run: npm run check:unused # Ratchet: unused exports must not grow
      - run: npm run check:docs # Links, heading anchors and code paths in the docs resolve
      - run: npm run check:licenses # Runtime dependencies under licences compatible with the AGPL
      - run: npm test # Execute tests
      - run: npm run test:e2e # Playwright: smoke specs, the core flow, the rooms in "Bibliothek", the first-visit onboarding, tablet, phone and whiteboard layouts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run build:static # Build, prerender all routes, verify the output (incl. bundle budgets)


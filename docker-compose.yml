# `docker compose up -d` uses the published image (or a previously built one);
# `docker compose up -d --build` builds from this repository instead.
services:
  klassenplan:
    # Pin a release instead of tracking `latest` by setting KLASSENPLAN_VERSION
    # (e.g. KLASSENPLAN_VERSION=3.5.0) in a .env file next to this one.
    image: ghcr.io/sireckehard/klassenplan:${KLASSENPLAN_VERSION:-latest}
    build:
      context: .
    environment:
      # Your instance, taken when the container starts — no build of your own
      # needed (see .env.example, decision 0048). Empty keeps klassenplan.de's.
      # The address the instance is served under: canonical, hreflang,
      # og:url, sitemap.
      SITE_URL: ${SITE_URL:-}
      # Your own Impressum and Datenschutzerklärung — set both when you publish
      # an instance; empty keeps the pages of klassenplan.de.
      IMPRINT_URL: ${IMPRINT_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      # Where the contact page and the error reports write to; empty keeps
      # the address of klassenplan.de's maintainer.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      # TLS terminates upstream (see nginx.conf) — put a reverse proxy in
      # front, or use docker-compose.https.yml. Inside the container nginx
      # listens on 8080 (it runs without root).
      - '${KLASSENPLAN_PORT:-8080}:8080'
    # Nothing to write but /tmp, and no privileges to keep.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

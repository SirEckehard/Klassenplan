# `docker compose up -d` uses the published image (or a previously built one);
# `docker compose up -d --build` builds from this repository instead.
services:
  klassenplan:
    # Pin a release instead of tracking `latest` by setting KLASSENPLAN_VERSION
    # (e.g. KLASSENPLAN_VERSION=2.1.0) in a .env file next to this one.
    image: ghcr.io/sireckehard/klassenplan:${KLASSENPLAN_VERSION:-latest}
    build:
      context: .
      args:
        # Baked into canonical/hreflang/og:url at build time (see .env.example).
        # Set SITE_URL when building for a host other than klassenplan.de.
        SITE_URL: ${SITE_URL:-https://klassenplan.de}
        # Your own Impressum and Datenschutzerklärung — set both when you publish
        # an instance; empty keeps the pages of klassenplan.de.
        IMPRINT_URL: ${IMPRINT_URL:-}
        PRIVACY_URL: ${PRIVACY_URL:-}
    ports:
      # TLS terminates upstream (see nginx.conf) — put a reverse proxy in front.
      - '${KLASSENPLAN_PORT:-8080}:80'
    restart: unless-stopped

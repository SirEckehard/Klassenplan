server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates upstream, so $scheme is always "http" here. Absolute
    # redirects would therefore send clients to http:// after an https://
    # request. Speculation-rules prefetches follow that redirect and get killed
    # by the CSP (default-src 'self' forbids the scheme change). Relative
    # redirects inherit the request scheme instead.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Brotli compression (modules installed via apt in Dockerfile)
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Security headers. The snippet must be re-included in every location that
    # sets its own add_header (see note inside the snippet).
    include /etc/nginx/snippets/security-headers.conf;

    # Brand files keep their names across releases (the logo, the favicons,
    # the icons the manifest and iOS point at), so a year of `immutable` would
    # keep a new logo from ever reaching a returning visitor. A day, then
    # revalidate. `^~` wins over the extension rules below.
    location ^~ /brand/ {
        gzip_static on;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The browser check keeps its name across releases too (index.html loads
    # it beside the hashed bundle), and the old boards that need it most often
    # run without a service worker: a day, then revalidate, as for /brand/.
    # An exact match wins over the extension rules below.
    location = /browser-check.js {
        gzip_static on;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed static assets (content hash in filename) - immutable long cache.
    # HTML is intentionally excluded: a stale index.html would reference old
    # chunk hashes that no longer exist after a deploy, breaking dynamic
    # imports ("Importing a module script failed"), especially in in-app
    # browsers that cache aggressively.
    location ~* \.(js|css|svg)$ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML entry points - always revalidate so clients pick up new chunk
    # references immediately after a deploy. Speculation rules are delivered
    # via HTTP header instead of an inline <script> so the CSP can stay at
    # script-src 'self' (see public/speculationrules.json).
    location ~* \.html$ {
        gzip_static on;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Speculation-Rules "\"/speculationrules.json\"" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Speculation rules need their dedicated MIME type (the default .json
    # mapping would be application/json, which browsers reject for rules
    # loaded via the Speculation-Rules header).
    location = /speculationrules.json {
        types { }
        default_type application/speculationrules+json;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache static assets
    location ~* \.(ico|png|jpg|jpeg|gif|webp|avif|woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Web app manifest and sitemap - moderate cache (regenerated per deploy,
    # so avoid the 1y immutable cache used for hashed static assets).
    location ~* \.(webmanifest|xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker - no cache
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Pages. Every route is prerendered into <path>/index.html (decision
    # 0029). Files that exist are served as they are; everything else goes to
    # @page, which serves the prerendered file for the address as it was asked
    # for. `$uri/` would be wrong here: on a directory it answers /faq with a
    # 301 to /faq/, while the canonical, the hreflang links, the sitemap and
    # every link in the app say /faq — Google then reports the address as
    # "Seite mit Weiterleitung" and the slash variant as an alternate.
    location / {
        try_files $uri @page;
    }

    # The prerendered HTML, with the headers of the HTML location above (a
    # named location does not pass through it). An address no route renders is
    # a real 404 with the prerendered "Seite nicht gefunden" page, not the
    # start page with status 200, which Google would read as a duplicate of /.
    location @page {
        try_files $uri/index.html =404;
        error_page 404 /404.html;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Speculation-Rules "\"/speculationrules.json\"" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Allow well-known URIs (e.g. /.well-known/security.txt) before the dot-file deny
    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }

    # One address per page: /faq/ moves for good to /faq, the address the
    # canonical names. Listed after the dot-file rule so /.git/ stays denied;
    # / itself does not match, and /brand/ and /.well-known/ are ^~ prefixes,
    # which regular expressions never override.
    location ~ ^(?<page>.+)/$ {
        return 301 $page$is_args$args;
    }
}

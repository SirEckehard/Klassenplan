server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Brotli compression (module installed via apk in Dockerfile)
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Hashed static assets (content hash in filename) - immutable long cache.
    # HTML is intentionally excluded: a stale index.html would reference old
    # chunk hashes that no longer exist after a deploy, breaking dynamic
    # imports ("Importing a module script failed"), especially in in-app
    # browsers that cache aggressively.
    location ~* \.(js|css|svg)$ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML entry points - always revalidate so clients pick up new chunk
    # references immediately after a deploy.
    location ~* \.html$ {
        gzip_static on;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://pics.paypal.com https://www.paypal.com https://www.paypalobjects.com; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://www.paypal.com; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cache static assets
    location ~* \.(ico|png|jpg|jpeg|gif|webp|woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Web app manifest and sitemap - moderate cache (regenerated per deploy,
    # so avoid the 1y immutable cache used for hashed static assets).
    location ~* \.(webmanifest|xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Service worker - no cache
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback - all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow well-known URIs (e.g. /.well-known/security.txt) before the dot-file deny
    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}

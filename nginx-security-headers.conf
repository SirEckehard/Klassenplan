# Shared security headers.
#
# IMPORTANT: nginx does NOT inherit add_header directives from the server
# level into any location block that declares its own add_header (e.g. for
# Cache-Control). Every such location must therefore `include` this file
# again — otherwise those responses (including index.html!) would be served
# without CSP/HSTS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), browsing-topics=(), interest-cohort=()" always;
# HSTS as klassenplan.de needs it: every subdomain on HTTPS, listed for the
# browsers' preload list. A self-hosted instance whose domain does not qualify
# mounts its own copy of this file over
# /etc/nginx/snippets/security-headers.conf — see docs/SECURITY.md.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  <!-- Speculation Rules: prefetch the most likely next routes (complements the
       JS routePreloader for full-page navigations from a cold start). Conservative
       eagerness keeps this from prefetching on every hover. -->
  <script type="speculationrules">
    {
      "prefetch": [
        {
          "source": "list",
          "eagerness": "moderate",
          "urls": ["/generator", "/export", "/faq", "/en/generator", "/en/export"]
        }
      ]
    }
  </script>
  <script>
    // Capture PWA install prompt immediately to avoid race conditions
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      // Dispatch custom event for React to pick up
      window.dispatchEvent(new Event('pwa-installable'));
    });
  </script>

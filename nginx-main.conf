#
# nginx's main configuration in the published image, in place of Alpine's.
# nginx runs as an unprivileged user (Dockerfile) and writes nothing outside
# /tmp, so the container also runs with a read-only file system and a tmpfs on
# /tmp (docker-compose.yml). The site itself is nginx.conf, in http.d/.

# No `user`: only a master started as root could switch to another.
pid /tmp/nginx/nginx.pid;
worker_processes auto;
pcre_jit on;
# A symlink to the container's stderr (Dockerfile).
error_log /var/log/nginx/error.log warn;

# The Brotli modules, from the apk package.
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 1m;
    sendfile on;
    tcp_nopush on;

    # Below /tmp, which the entrypoint prepares, instead of the compiled-in
    # /var/lib/nginx/tmp.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /etc/nginx/http.d/*.conf;
}
